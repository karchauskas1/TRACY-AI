name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web-app/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json
      
      - name: Install dependencies
        working-directory: ./web-app
        run: npm ci
      
      - name: Debug - Check file structure
        working-directory: ./web-app
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== File structure ==="
          ls -la
          echo "=== lib directory ==="
          ls -la lib/ || echo "lib directory not found"
          echo "=== Check utils.ts ==="
          cat lib/utils.ts | head -10 || echo "utils.ts not found"
          echo "=== Check app structure ==="
          find app -name "*.tsx" -exec echo "File: {}" \; -exec head -15 {} \; | head -50
      
      - name: Build
        working-directory: ./web-app
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          NODE_ENV: production
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ secrets.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
        run: npm run build
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web-app/out'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

